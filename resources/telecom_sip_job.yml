resources:
  jobs:
    telecom_sip_job:
      name: telecom_sip_pipeline_dab

      trigger:
        file_arrival:
          url: /Volumes/telecom/landing/raw_files/sip/

      tasks:
        - task_key: bronze_sip
          notebook_task:
            notebook_path: ../notebooks/01_bronze_sip.ipynb

        - task_key: silver_sip
          depends_on:
            - task_key: bronze_sip
          notebook_task:
            notebook_path: ../notebooks/02_silver_sip.ipynb

        - task_key: gold_sip
          depends_on:
            - task_key: silver_sip
          notebook_task:
            notebook_path: ../notebooks/03_gold_sip_registration.ipynb